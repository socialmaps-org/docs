<!doctype html>
<html>
  <head>
    <title>Social Maps API Reference</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>

  <body>
    <div id="app"></div>

    <script
      crossorigin="anonymous"
      integrity="sha256-UT9G5oe85T0rwtaF9aKvRbn0QiRWAfrVHFzOQdUkYww="
      src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.64.0/dist/browser/standalone.min.js"
    ></script>

    <script>
      Scalar.createApiReference("#app", {
        url: "openapi.json",
        withDefaultFonts: false,
        defaultOpenAllTags: true,
        expandAllModelSections: true,
        expandAllResponses: true,
        orderSchemaPropertiesBy: "preserve",
        telemetry: false,
        hideClientButton: true,
        agent: {
          disabled: true,
        },
        mcp: {
          disabled: true,
        },
      });
    </script>
  </body>
</html>
