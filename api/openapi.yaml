components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    Place:
      additionalProperties: false
      properties:
        id:
          description: Unique identifier for this **Place**.
          format: int64
          minimum: 1
          type: integer
        location:
          additionalProperties: false
          description: The geolocation of this **Place** (or its centre if it's a way/relation) based on [WGS 84](https://en.wikipedia.org/wiki/WGS-84).
          properties:
            lat:
              description: Latitude in decimal degrees.
              format: double
              maximum: 180
              minimum: -180
              type: number
            lon:
              description: Latitude in decimal degrees.
              format: double
              maximum: 90
              minimum: -90
              type: number
          required:
            - lat
            - lon
          type: object
        name:
          description: The common, default name in the local language of this **Place**.
          maxLength: 256
          type: string
        object:
          enum:
            - place
          type: string
        osm_id:
          description: OpenStreetMap [ID](https://wiki.openstreetmap.org/wiki/Elements#id) of this **Place**.
          format: int64
          type: integer
        osm_tags:
          additionalProperties:
            type: string
          description: OpenStreetMap [tags](https://wiki.openstreetmap.org/wiki/Tags) of this **Place**.
          type: object
        osm_type:
          description: OpenStreetMap [type](https://wiki.openstreetmap.org/wiki/Elements) of this **Place**.
          type: string
        rating_stats:
          additionalProperties: false
          description: Statistics about the **Reviews** of this **Place**.
          properties:
            count:
              description: Number of **Review**s created for this **Place**.
              format: int64
              minimum: 0
              type: integer
            like_ratio:
              description: Ratio of **Review**s that liked this **Place** to all its **Review**s.
              format: double
              maximum: 1
              minimum: 0
              type:
                - number
                - "null"
            score:
              description: The likeability score of this **Place** based on the ratio of **Review**s that liked it, the total number of and the recency of its **Review**s.
              exclusiveMaximum: 1
              exclusiveMinimum: 0
              format: double
              type: number
          required:
            - count
            - like_ratio
            - score
          type: object
      required:
        - id
        - osm_type
        - osm_id
        - osm_tags
      type: object
    Query:
      additionalProperties: false
      properties:
        predicate:
          description: A PostgreSQL-compatible SQL-standard SQL/JSON Path expression that can be used to filter **Place**s by their OpenStreetMap [tags](https://wiki.openstreetmap.org/wiki/Tags) while **query**ing them.
          examples:
            - $.amenity == "restaurant" && $.cuisine like_regex "turkish" && $.outdoor_seating == "yes"
          type: string
      required:
        - predicate
      type: object
    Review:
      additionalProperties: false
      properties:
        comment:
          description: The comment written by the **User** about this **Place**, if written. Otherwise can be an empty string.
          type: string
        created:
          description: The [UNIX timestamp](https://en.wikipedia.org/wiki/Unix_time) of when this **Review** was created.
          format: int64
          minimum: 0
          type: integer
        id:
          description: Unique identifier for this **Review**.
          format: int64
          minimum: 1
          type: integer
        liked:
          description: Whether the **User** liked this **Place** or not.
          type: boolean
        n_likes:
          description: The number of users who liked this **Review**.
          format: int64
          minimum: 0
          type: integer
        object:
          enum:
            - review
          type: string
        place:
          additionalProperties: false
          description: The **Place** which this **Review** is about. This is a stub object, meaning it contains only an ID.
          properties:
            id:
              format: int64
              minimum: 1
              type: integer
          required:
            - id
          type: object
        user:
          additionalProperties: false
          description: The **User** who created this **Review**. This is a stub object, meaning it contains only an ID.
          properties:
            id:
              examples:
                - 2077851
              format: int64
              minimum: 1
              type: integer
          required:
            - id
          type: object
      required:
        - object
        - id
        - created
        - place
        - user
        - liked
        - comment
        - n_likes
      type: object
    User:
      additionalProperties: false
      properties:
        display_name:
          examples:
            - boramalper
          type: string
        id:
          examples:
            - 2077851
          format: int64
          minimum: 1
          type: integer
      required:
        - id
        - display_name
      type: object
  securitySchemes:
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: https://auth.socialmaps.org/realms/socialmaps/protocol/openid-connect/auth
          scopes: null
          tokenUrl: https://auth.socialmaps.org/realms/socialmaps/protocol/openid-connect/token
      type: oauth2
info:
  title: Social Maps API
  version: 0.20251213.0
openapi: 3.1.0
paths:
  /v1/places:
    get:
      description: |
        Query Places in a bounding-box filtered by their OpenStreetMap [tags](https://wiki.openstreetmap.org/wiki/Tags).
      operationId: query_places
      parameters:
        - description: Maximum latitude (i.e. north-side) of the bounding-box in which **Places** are.
          explode: false
          in: query
          name: max_lat
          required: true
          schema:
            description: Maximum latitude (i.e. north-side) of the bounding-box in which **Places** are.
            format: double
            maximum: 180
            minimum: -180
            type: number
        - description: Maximum longitude (i.e. east-side) of the bounding-box in which **Places** are.
          explode: false
          in: query
          name: max_lon
          required: true
          schema:
            description: Maximum longitude (i.e. east-side) of the bounding-box in which **Places** are.
            format: double
            maximum: 90
            minimum: -90
            type: number
        - description: Minimum latitude (i.e. south-side) of the bounding-box in which **Places** are.
          explode: false
          in: query
          name: min_lat
          required: true
          schema:
            description: Minimum latitude (i.e. south-side) of the bounding-box in which **Places** are.
            format: double
            maximum: 180
            minimum: -180
            type: number
        - description: Minimum longitude (i.e. west-side) of the bounding-box in which **Places** are.
          explode: false
          in: query
          name: min_lon
          required: true
          schema:
            description: Minimum longitude (i.e. west-side) of the bounding-box in which **Places** are.
            format: double
            maximum: 90
            minimum: -90
            type: number
        - description: A PostgreSQL-compatible SQL-standard SQL/JSON Path expression to filter **Places** in the bounding-box by their OpenStreetMap [tags](https://wiki.openstreetmap.org/wiki/Tags).
          example: $.amenity == "restaurant" && $.cuisine like_regex "turkish" && $.outdoor_seating == "yes"
          explode: false
          in: query
          name: predicate
          required: true
          schema:
            description: A PostgreSQL-compatible SQL-standard SQL/JSON Path expression to filter **Places** in the bounding-box by their OpenStreetMap [tags](https://wiki.openstreetmap.org/wiki/Tags).
            examples:
              - $.amenity == "restaurant" && $.cuisine like_regex "turkish" && $.outdoor_seating == "yes"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      $ref: "#/components/schemas/Place"
                    type: array
                  object:
                    enum:
                      - list
                    type: string
                required:
                  - object
                  - data
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Query Places
      tags:
        - Places
  /v1/places/lookup:
    get:
      description: |
        Look up a Place by its name and geo-coordinates.

        We require clients to look up Places by their "name + location" because OpenStreetMap IDs are [not permanent](https://wiki.openstreetmap.org/wiki/Permanent_ID). You can read more about it in the [docs](https://docs.socialmaps.org/https://docs.socialmaps.org/lookups/).
      operationId: lookup_place
      parameters:
        - description: The name of the **Place** in any language verbatim as recorded in OpenStreetMap.
          explode: false
          in: query
          name: name
          required: true
          schema:
            description: The name of the **Place** in any language verbatim as recorded in OpenStreetMap.
            maxLength: 256
            type: string
        - description: |-
            Latitude of the **Place** (or its centre if it's a way/relation) in decimal degrees based on [WGS 84](https://en.wikipedia.org/wiki/WGS-84).

            The location doesn't have to be exactly accurate, but must be precise enough (7 decimal places) to narrow down the search.
          explode: false
          in: query
          name: lat
          required: true
          schema:
            description: |-
              Latitude of the **Place** (or its centre if it's a way/relation) in decimal degrees based on [WGS 84](https://en.wikipedia.org/wiki/WGS-84).

              The location doesn't have to be exactly accurate, but must be precise enough (7 decimal places) to narrow down the search.
            format: double
            maximum: 180
            minimum: -180
            type: number
        - description: |-
            Approximate longitude of the **Place** (or its centre if it's a way/relation) in decimal degrees based on [WGS 84](https://en.wikipedia.org/wiki/WGS-84).

            The location doesn't have to be exactly accurate, but must be precise enough (7 decimal places) to narrow down the search.
          explode: false
          in: query
          name: lon
          required: true
          schema:
            description: |-
              Approximate longitude of the **Place** (or its centre if it's a way/relation) in decimal degrees based on [WGS 84](https://en.wikipedia.org/wiki/WGS-84).

              The location doesn't have to be exactly accurate, but must be precise enough (7 decimal places) to narrow down the search.
            format: double
            maximum: 90
            minimum: -90
            type: number
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Lookup a Place
      tags:
        - Places
  /v1/places/query/formulate:
    get:
      description: |
        Formulate a query.

        **This is an experimental endpoint.**
      operationId: formulate_query
      parameters:
        - description: A user query in natural language for querying **Place**s.
          example: Turkish restaurants with outdoor seating
          explode: false
          in: query
          name: query
          schema:
            description: A user query in natural language for querying **Place**s.
            examples:
              - Turkish restaurants with outdoor seating
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Query"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Formulate a query
      tags:
        - Places
  /v1/places/{place_id}:
    get:
      description: |
        Retrieve a Place by ID.
      operationId: retrieve_place
      parameters:
        - description: Unique identifier for the **Place** you are retrieving.
          in: path
          name: place_id
          required: true
          schema:
            description: Unique identifier for the **Place** you are retrieving.
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retrieve a Place
      tags:
        - Places
  /v1/places/{place_id}/reviews:
    get:
      description: |
        List Reviews of a Place by Place ID.
      operationId: list_reviews_of_place
      parameters:
        - description: Unique identifier for the **Place** the user is listing **Review** for.
          in: path
          name: place_id
          required: true
          schema:
            description: Unique identifier for the **Place** the user is listing **Review** for.
            format: int64
            minimum: 1
            type: integer
        - description: Maximum number of **Review**s to return at a time.
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Maximum number of **Review**s to return at a time.
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  data:
                    items:
                      additionalProperties: false
                      properties:
                        comment:
                          description: The comment written by the **User** about this **Place**, if written. Otherwise can be an empty string.
                          type: string
                        created:
                          description: The [UNIX timestamp](https://en.wikipedia.org/wiki/Unix_time) of when this **Review** was created.
                          format: int64
                          minimum: 0
                          type: integer
                        id:
                          description: Unique identifier for this **Review**.
                          format: int64
                          minimum: 1
                          type: integer
                        liked:
                          description: Whether the **User** liked this **Place** or not.
                          type: boolean
                        n_likes:
                          description: The number of users who liked this **Review**.
                          format: int64
                          minimum: 0
                          type: integer
                        object:
                          enum:
                            - review
                          type: string
                        place:
                          additionalProperties: false
                          description: The **Place** which this **Review** is about. This is a stub object, meaning it contains only an ID.
                          properties:
                            id:
                              format: int64
                              minimum: 1
                              type: integer
                          required:
                            - id
                          type: object
                        user:
                          $ref: "#/components/schemas/User"
                          description: The **User** who created this **Review**. This is an expanded object, meaning it contains all fields.
                      required:
                        - user
                        - object
                        - id
                        - created
                        - place
                        - liked
                        - comment
                        - n_likes
                      type: object
                    type: array
                  object:
                    enum:
                      - list
                    type: string
                required:
                  - object
                  - data
                type: object
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List Reviews of a Place
      tags:
        - Reviews
    post:
      description: |
        Create a Review of a Place.
      operationId: create_review
      parameters:
        - description: Unique identifier for the **Place** the user is creating a **Review** for.
          in: path
          name: place_id
          required: true
          schema:
            description: Unique identifier for the **Place** the user is creating a **Review** for.
            format: int64
            minimum: 0
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                comment:
                  description: The comment written by the user about this **Place**, if written. Otherwise can be an empty string.
                  type: string
                liked:
                  description: Whether the user liked this **Place** or not.
                  type: boolean
              required:
                - liked
                - comment
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - oauth2:
            - reviews:write
      summary: Create a Review
      tags:
        - Reviews
  /v1/reviews/{review_id}:
    delete:
      description: |
        Delete a Review.
      operationId: delete_review
      parameters:
        - in: path
          name: review_id
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - oauth2:
            - reviews:write
      summary: Delete a Review
      tags:
        - Reviews
    put:
      description: |
        Update a Review.

        You cannot update a Review more than an hour after creating it. You can, however, delete a Review any time and create a new one.
      operationId: update_review
      parameters:
        - description: Unique identifier for the **Review** the user is updating.
          in: path
          name: review_id
          required: true
          schema:
            description: Unique identifier for the **Review** the user is updating.
            format: int64
            minimum: 1
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                comment:
                  description: The comment written by the user about this **Place**, if written. Otherwise can be an empty string.
                  type: string
                liked:
                  description: Whether the user liked this **Place** or not.
                  type: boolean
              required:
                - liked
                - comment
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - oauth2:
            - reviews:write
      summary: Update a Review
      tags:
        - Reviews
  /v1/reviews/{review_id}/like:
    put:
      description: |
        Like a **Review**.

        A **User** cannot like their own **Review**.
      operationId: like_review
      parameters:
        - in: path
          name: review_id
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - oauth2:
            - reviews:write
      summary: Like a Review
      tags:
        - Reviews
  /v1/reviews/{review_id}/unlike:
    put:
      description: |
        Unlike a Review.
      operationId: unlike_review
      parameters:
        - in: path
          name: review_id
          required: true
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - oauth2:
            - reviews:write
      summary: Unlike a Review
      tags:
        - Reviews
